<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>IntelliChef — Kya Pakana Hai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f7f3;
        --surface: #fff;
        --surface2: #f0f3ec;
        --text: #17231d;
        --muted: #728078;
        --line: #e1e7df;
        --primary: #2f7d4b;
        --primary-dark: #215f38;
        --lime: #b9d96b;
        --orange: #e9954a;
        --purple: #8171bd;
        --blue: #5f9db8;
        --shadow: 0 12px 35px rgba(27, 53, 38, 0.08);
        --radius: 20px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: "DM Sans", sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .app-shell {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 255px;
        background: #fff;
        border-right: 1px solid var(--line);
        padding: 25px 18px;
        display: flex;
        flex-direction: column;
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 9px 30px;
      }
      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .brand strong {
        display: block;
        font-size: 16px;
      }
      .brand span {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.5px;
      }
      .nav {
        display: grid;
        gap: 6px;
      }
      .nav-item {
        border: 0;
        background: transparent;
        text-align: left;
        color: #637168;
        padding: 12px 13px;
        border-radius: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 13px;
        transition: 0.2s;
      }
      .nav-item span {
        width: 20px;
        text-align: center;
        font-size: 18px;
      }
      .nav-item:hover {
        background: var(--surface2);
        color: var(--primary);
      }
      .nav-item.active {
        background: #eaf4e9;
        color: var(--primary);
      }
      .sidebar-card {
        margin-top: auto;
        background: #edf6e9;
        border-radius: 17px;
        padding: 16px;
      }
      .mini-icon {
        display: block;
        background: #fff;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        margin-bottom: 12px;
      }
      .sidebar-card strong {
        font-size: 13px;
      }
      .sidebar-card p {
        font-size: 11px;
        line-height: 1.5;
        color: var(--muted);
        margin: 6px 0 12px;
      }
      .small-btn {
        border: 0;
        background: var(--primary);
        color: #fff;
        border-radius: 9px;
        padding: 8px 10px;
        font-size: 11px;
        font-weight: 700;
      }
      .sidebar-footer {
        font-size: 9px;
        color: #a0aaa3;
        text-align: center;
        margin-top: 17px;
      }
      .main {
        margin-left: 255px;
        width: calc(100% - 255px);
      }
      .topbar {
        height: 70px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 38px;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .breadcrumb {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }
      .breadcrumb strong {
        color: var(--text);
      }
      .top-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .icon-btn,
      .menu-btn {
        border: 1px solid var(--line);
        background: #fff;
        width: 36px;
        height: 36px;
        border-radius: 10px;
      }
      .menu-btn {
        display: none;
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #dcead8;
        color: var(--primary);
        font-size: 11px;
        font-weight: 800;
      }
      .content {
        padding: 32px 38px 55px;
        max-width: 1450px;
        margin: auto;
      }
      .page {
        display: none;
      }
      .page.active {
        display: block;
      }
      .hero {
        min-height: 310px;
        border-radius: 27px;
        background: linear-gradient(110deg, #193c28, #326d43);
        color: #fff;
        padding: 44px 50px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      .hero:after {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        right: -140px;
        top: -170px;
        background: rgba(185, 217, 107, 0.13);
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.5px;
        color: #83a08d;
      }
      .hero .eyebrow {
        color: #c5dbab;
      }
      .hero h1 {
        font:
          700 46px/1.05 "Playfair Display",
          serif;
        margin: 8px 0 10px;
        letter-spacing: -1px;
      }
      .hero h1 em {
        color: #c9e07c;
        font-style: normal;
      }
      .hero p {
        margin: 0;
        color: #d7e6dc;
        font-size: 15px;
      }
      .hero-actions {
        display: flex;
        gap: 10px;
        margin-top: 26px;
      }
      .primary-btn,
      .secondary-btn {
        border: 0;
        border-radius: 11px;
        padding: 12px 17px;
        font-size: 12px;
        font-weight: 800;
      }
      .primary-btn {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 6px 15px rgba(47, 125, 75, 0.18);
      }
      .hero .primary-btn {
        background: #d0e77d;
        color: #1e4228;
      }
      .secondary-btn {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--text);
      }
      .hero .secondary-btn {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.25);
        color: #fff;
      }
      .compact {
        padding: 8px 11px;
        font-size: 10px;
      }
      .text-btn {
        border: 0;
        background: transparent;
        color: var(--primary);
        font-size: 11px;
        font-weight: 800;
      }
      .hero-art {
        margin-left: auto;
        width: 280px;
        height: 230px;
        position: relative;
      }
      .plate {
        position: absolute;
        width: 190px;
        height: 190px;
        border-radius: 50%;
        background: #fff;
        right: 25px;
        top: 24px;
        box-shadow: 0 20px 35px rgba(0, 0, 0, 0.15);
        border: 12px solid #e9efe5;
      }
      .plate:before {
        content: "";
        position: absolute;
        inset: 22px;
        border-radius: 50%;
        background: #dcebd0;
      }
      .food {
        position: absolute;
        border-radius: 50%;
        z-index: 2;
      }
      .food-a {
        width: 82px;
        height: 55px;
        background: #d87938;
        left: 39px;
        top: 52px;
        transform: rotate(-16deg);
      }
      .food-b {
        width: 55px;
        height: 45px;
        background: #8db65a;
        left: 80px;
        top: 91px;
      }
      .food-c {
        width: 48px;
        height: 34px;
        background: #e6b553;
        left: 50px;
        top: 111px;
        transform: rotate(18deg);
      }
      .steam {
        position: absolute;
        width: 18px;
        height: 60px;
        border: 3px solid rgba(255, 255, 255, 0.45);
        border-bottom: 0;
        border-left-color: transparent;
        border-radius: 50%;
        top: 0;
      }
      .s1 {
        right: 135px;
      }
      .s2 {
        right: 96px;
        top: 15px;
      }
      .s3 {
        right: 65px;
        top: 4px;
      }
      .section-head,
      .page-intro {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin: 34px 0 16px;
      }
      .section-head h2,
      .page-intro h1 {
        margin: 4px 0 0;
        font:
          700 25px "Playfair Display",
          serif;
      }
      .page-intro {
        align-items: center;
      }
      .page-intro p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .page-intro h1 {
        font-size: 32px;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }
      .stat-card,
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 5px 20px rgba(25, 45, 32, 0.025);
      }
      .stat-card {
        padding: 18px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
      }
      .stat-icon {
        width: 39px;
        height: 39px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-weight: 800;
      }
      .green {
        background: #e4f2df;
        color: var(--primary);
      }
      .orange {
        background: #fff0df;
        color: #d37b25;
      }
      .purple {
        background: #eee9fb;
        color: var(--purple);
      }
      .blue {
        background: #e3f1f5;
        color: var(--blue);
      }
      .stat-card strong {
        display: block;
        font-size: 19px;
      }
      .stat-card div span {
        font-size: 10px;
        color: var(--muted);
      }
      .stat-card small {
        font-size: 9px;
        color: var(--muted);
      }
      .stat-card small.good,
      .green-text {
        color: var(--primary);
      }
      .orange-text {
        color: #d47a27;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 15px;
        margin-top: 15px;
      }
      .panel {
        padding: 21px;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
      }
      .panel h3 {
        margin: 0;
        font-size: 14px;
      }
      .panel-head p {
        margin: 4px 0 0;
        font-size: 10px;
        color: var(--muted);
      }
      .recipe-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 18px;
      }
      .mini-recipe {
        border: 1px solid var(--line);
        border-radius: 13px;
        overflow: hidden;
      }
      .recipe-cover {
        height: 95px;
        display: grid;
        place-items: center;
        font-size: 43px;
        background: linear-gradient(135deg, #f1e1c5, #d9edcf);
      }
      .mini-recipe:nth-child(2) .recipe-cover {
        background: linear-gradient(135deg, #f7dbb4, #f0efc9);
      }
      .mini-recipe:nth-child(3) .recipe-cover {
        background: linear-gradient(135deg, #d9e6f0, #ece1cb);
      }
      .mini-recipe div:last-child {
        padding: 9px;
      }
      .mini-recipe b {
        font-size: 11px;
        display: block;
      }
      .mini-recipe small {
        font-size: 9px;
        color: var(--muted);
      }
      .badge {
        font-size: 9px;
        padding: 6px 9px;
        border-radius: 20px;
      }
      .green-badge {
        background: #e7f4e4;
        color: var(--primary);
      }
      .budget-meter {
        margin-top: 25px;
      }
      .meter-label,
      .meter-foot {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
      }
      .meter-label strong {
        font-size: 22px;
      }
      .meter {
        height: 10px;
        border-radius: 20px;
        background: #e8eee6;
        margin: 12px 0 7px;
        overflow: hidden;
      }
      .meter i {
        height: 100%;
        display: block;
        background: var(--primary);
        border-radius: 20px;
      }
      .meter-foot {
        color: var(--muted);
      }
      .tip {
        display: flex;
        gap: 9px;
        background: #f7f5e8;
        border-radius: 12px;
        padding: 11px;
        margin-top: 19px;
      }
      .tip p {
        margin: 0;
        font-size: 10px;
        line-height: 1.45;
        color: #68705e;
      }
      .wide-panel {
        margin-top: 15px;
      }
      .chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      .chip {
        padding: 9px 12px;
        background: #f3f6f0;
        border: 1px solid var(--line);
        border-radius: 30px;
        font-size: 10px;
        color: #536159;
      }
      .chip.low {
        background: #fff3e7;
        color: #ba6d27;
        border-color: #f2d3ae;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .search {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 11px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        flex: 1;
        max-width: 460px;
      }
      .search span {
        font-size: 19px;
        color: var(--muted);
      }
      .search input {
        border: 0;
        outline: 0;
        padding: 11px 0;
        width: 100%;
        font-size: 11px;
      }
      .toolbar select,
      .planner-controls select,
      .planner-controls input,
      .missing-form select {
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #fff;
        padding: 10px 12px;
        font-size: 11px;
        color: var(--text);
        outline: 0;
      }
      .recipe-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
      .recipe-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        transition: 0.2s;
      }
      .recipe-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow);
      }
      .recipe-img {
        height: 150px;
        display: grid;
        place-items: center;
        font-size: 65px;
        background: linear-gradient(135deg, #e5efd9, #f5e4c8);
      }
      .recipe-card:nth-child(3n + 2) .recipe-img {
        background: linear-gradient(135deg, #f8ddc1, #e5efcd);
      }
      .recipe-card:nth-child(3n) .recipe-img {
        background: linear-gradient(135deg, #dae7f1, #f1dfc8);
      }
      .recipe-body {
        padding: 15px;
      }
      .tag {
        font-size: 8px;
        color: var(--primary);
        font-weight: 800;
        background: #edf6e9;
        border-radius: 20px;
        padding: 5px 8px;
      }
      .recipe-body h3 {
        font-size: 15px;
        margin: 9px 0 5px;
      }
      .recipe-body p {
        font-size: 10px;
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 13px;
      }
      .recipe-meta {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 9px;
      }
      .recipe-meta b {
        color: var(--text);
      }
      .pantry-summary {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 0;
        margin-bottom: 15px;
      }
      .pantry-summary div {
        padding: 20px;
        border-right: 1px solid var(--line);
      }
      .pantry-summary div:last-child {
        border: 0;
      }
      .pantry-summary span {
        display: block;
        color: var(--muted);
        font-size: 10px;
      }
      .pantry-summary strong {
        font-size: 21px;
        display: block;
        margin-top: 4px;
      }
      .small-search {
        max-width: 220px;
      }
      .inventory {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        margin-top: 17px;
      }
      .inventory-item {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .inventory-icon {
        width: 35px;
        height: 35px;
        border-radius: 10px;
        background: #f1f5ed;
        display: grid;
        place-items: center;
        font-size: 17px;
      }
      .inventory-item strong {
        display: block;
        font-size: 11px;
      }
      .inventory-item small {
        color: var(--muted);
        font-size: 9px;
      }
      .status {
        margin-left: auto;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--primary);
      }
      .status.low {
        background: var(--orange);
      }
      .planner-controls {
        background: #edf5e9;
        border-radius: 16px;
        padding: 14px;
        display: flex;
        gap: 18px;
        align-items: center;
        margin-bottom: 15px;
      }
      .planner-controls label {
        font-size: 10px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .week-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
      }
      .day-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 15px;
        overflow: hidden;
        min-height: 250px;
      }
      .day-head {
        padding: 11px;
        background: #f3f6f0;
        font-size: 10px;
        font-weight: 800;
        text-align: center;
      }
      .day-card.today .day-head {
        background: var(--primary);
        color: #fff;
      }
      .meal {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .meal:last-child {
        border-bottom: 0;
      }
      .meal small {
        font-size: 8px;
        color: var(--muted);
        display: block;
      }
      .meal strong {
        font-size: 10px;
        display: block;
        margin-top: 3px;
      }
      .meal .emoji {
        font-size: 23px;
        margin-bottom: 3px;
      }
      .price-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 13px;
        margin-bottom: 15px;
      }
      .price-highlight {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 19px;
      }
      .price-highlight span {
        font-size: 9px;
        color: var(--muted);
        display: block;
      }
      .price-highlight strong {
        font-size: 24px;
        display: block;
        margin: 7px 0;
      }
      .price-highlight small {
        font-size: 9px;
        color: var(--primary);
      }
      .price-highlight small.bad {
        color: #cf722c;
      }
      .price-table {
        margin-top: 15px;
      }
      .price-line {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr 1fr;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding: 12px 5px;
        font-size: 10px;
      }
      .price-line.head {
        font-size: 8px;
        color: var(--muted);
        font-weight: 800;
        text-transform: uppercase;
      }
      .up {
        color: #ce7331;
      }
      .down {
        color: var(--primary);
      }
      .missing-cost {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 20px;
        margin-top: 15px;
        align-items: center;
      }
      .missing-form {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .cost-result {
        background: #f0f6e9;
        border-radius: 15px;
        padding: 18px 25px;
        min-width: 180px;
      }
      .cost-result span,
      .cost-result small {
        font-size: 9px;
        color: var(--muted);
        display: block;
      }
      .cost-result strong {
        font-size: 25px;
        display: block;
        margin: 3px 0;
      }
      .budget-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }
      .big-budget {
        display: flex;
        align-items: center;
        gap: 25px;
      }
      .big-budget h2 {
        font:
          700 31px "Playfair Display",
          serif;
        margin: 5px 0;
      }
      .big-budget p {
        font-size: 10px;
        color: var(--muted);
      }
      .ring {
        width: 125px;
        height: 125px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: conic-gradient(var(--primary) 0 84.5%, #e8eee5 84.5%);
        position: relative;
        flex: none;
      }
      .ring:after {
        content: "";
        position: absolute;
        width: 91px;
        height: 91px;
        border-radius: 50%;
        background: #fff;
      }
      .ring span,
      .ring small {

        return {

      const R = () => R0.concat(S.custom),

      const qf = (n, u) =>
        u == "kg" && n < 1

      function calc(r, sv) {
        const k = sv / r.s;
        let tot = 0,
          miss = 0,
          rows = [];
        for (const [i, q] of Object.entries(r.i)) {
          const need = q * k,
            have = S.pantry[i] || 0,
            m = Math.max(0, need - have);
          tot += need * S.pr[i][0];
          miss += m * S.pr[i][0];
          rows.push({ i, need, have, m });
        }
        return { tot, miss, rows };

<div class="stat-card"><span class="stat-icon blue">⌁</span><div><strong>${pch > 0 ? "+" : ""}${pch.toFixed(1)}%</strong><span>Price change</span></div><small>since last edit</small></div></div>
<div class="dashboard-grid"><div class="panel"><div class="panel-head"><div><h3>Smart picks for tonight</h3><p>Cheapest to cook based on your pantry</p></div><button class="text-btn" onclick="go('recipes')">View all</button></div><div class="recipe-row">${picks.map(([r, c]) => `<div class="mini-recipe" style="cursor:pointer" onclick="go('recipes')"><div class="recipe-cover">${em(r)}</div><div><b>${r.n}</b><small>${c.miss ? rs(c.miss) + " to buy" : "Ready to cook ✓"}</small></div></div>`).join("")}</div></div>
<div class="panel"><div class="panel-head"><div><h3>Monthly food cap</h3><p>Your spending guard</p></div><span class="badge green-badge">${sp > S.cap ? "Over cap" : pc > 85 ? "Careful" : "On track"}</span></div><div class="budget-meter"><div class="meter-label"><strong>${rs(sp)}</strong><span>of ${rs(S.cap)}</span></div><div class="meter"><i style="width:${pc}%"></i></div><div class="meter-foot"><span>${rs(Math.max(0, S.cap - sp))} remaining</span><span>${pc.toFixed(1)}%</span></div></div><div class="tip"><span>💡</span><p><b>Smart tip:</b> ${nl ? "Restock " + pk.filter(low).map(cap).slice(0, 3).join(", ") + " soon." : "Cook pantry-based meals to keep spending down."}</p></div></div></div>
<div class="panel wide-panel"><div class="panel-head"><div><h3>What's in your kitchen?</h3><p>Quick look at your pantry inventory</p></div><button class="secondary-btn compact" onclick="go('pantry')">+ Add item</button></div><div class="chip-list">${pk.map((k) => `<span class="chip ${low(k) ? "low" : ""}">${cap(k)} · ${qf(S.pantry[k], U(k))}</span>`).join("") || '<span class="mut">Pantry is empty.</span>'}</div></div></section>`);
      };
      function theme() {
        document.body.classList.toggle("dark");
        try {
          localStorage.setItem(
            "ict",
            document.body.classList.contains("dark") ? 1 : 0,
          );
        } catch (e) {}
      }
      try {
        const t = localStorage.getItem("ict");
        if (
          t === "1" ||
          (t === null && matchMedia("(prefers-color-scheme:dark)").matches)
        )
          document.body.classList.add("dark");
      } catch (e) {}

      const TM = {
          "Chicken Biryani": 75,
          "Chicken Karahi": 40,
          "Beef Pulao": 70,
          "Daal Chawal": 40,
          "Chana Masala": 45,
          Khichdi: 30,
          "Aloo Gobi": 35,
          "Aloo Palak": 30,
          "Bhindi Masala": 30,
          "Egg Paratha": 25,
          "Anda Bhurji": 15,
          "Rice Kheer": 50,
        },
        tm = (r) => r.tm || TM[r.n] || 30;
      const PC = [
        "#2f7d4b",
        "#e9954a",
        "#8171bd",
        "#5f9db8",
        "#b9d96b",
        "#d9480f",
      ];
      function pieCard(sp) {
        const m = {};
        S.exp
          .filter((e) => e.d.slice(0, 7) == month())
          .forEach((e) => (m[e.l] = (m[e.l] || 0) + e.a));
        const sl = Object.entries(m).map(([l, v], i) => ({
            l,
            v,
            c: PC[i % PC.length],
          })),
          rem = Math.max(0, S.cap - sp);
        if (rem > 0) sl.push({ l: "Remaining", v: rem, c: "var(--line)" });
        const T = sl.reduce((a, s) => a + s.v, 0);
        let a0 = -Math.PI / 2,
          p = "";
        sl.forEach((s) => {
          const f = s.v / T;
          if (f >= 0.9999) {
            p += `<circle cx="100" cy="100" r="90" style="fill:${s.c}"/>`;
            return;
          }
          const a1 = a0 + f * 2 * Math.PI,
            P = (a, r) =>
              (100 + r * Math.cos(a)).toFixed(2) +
              " " +
              (100 + r * Math.sin(a)).toFixed(2);
          p += `<path d="M100 100L${P(a0, 90)}A90 90 0 ${f > 0.5 ? 1 : 0} 1 ${P(a1, 90)}Z" style="fill:${s.c};stroke:var(--surface);stroke-width:2"/>`;
          a0 = a1;
        });
        return `<div class="card"><h3>Where your cap is going</h3><div class="row" style="gap:28px"><svg viewBox="0 0 200 200" width="210" height="210">${p}</svg><div>${sl.map((s) => `<div style="margin:7px 0"><i style="display:inline-block;width:12px;height:12px;border-radius:4px;background:${s.c};margin-right:8px;vertical-align:-1px"></i>${s.l} — <b>${rs(s.v)}</b> (${Math.round((s.v / T) * 100)}%)</div>`).join("")}</div></div><p class="mut">${sp ? "Spent " + rs(sp) + " of " + rs(S.cap) + " (" + Math.round((sp / S.cap) * 100) + "%) this month." : "Nothing spent yet this month — the full cap is available."}</p></div>`;
      }
      let fl = { quick: 0, cheap: 0, pantry: 0 },
        hl = -1;
      function ideaList() {
        let L = R().map((r, x) => {
          const c = calc(r, r.s);
          return {
            r,
            x,
            c,
            cv: c.rows.filter((z) => z.m <= 0.0001).length / c.rows.length,
            pp: c.tot / r.s,
          };
        });
        if (fl.quick) L = L.filter((o) => tm(o.r) <= 30);
        if (fl.cheap) L = L.filter((o) => o.pp <= 100);
        if (fl.pantry) L = L.filter((o) => o.cv >= 0.5);
        return L.sort((a, b) => b.cv - a.cv || tm(a.r) - tm(b.r));
      }
      V.ideas = () => {
        const L = ideaList(),
          F = [
            ["quick", "⚡ Quick (≤ 30 min)"],
            ["cheap", "💸 Cheap (≤ Rs 100/person)"],
            ["pantry", "🏠 From your pantry"],
          ];
        app(`<div class="page-intro"><div><span class="eyebrow">COOKING IDEAS</span><h1>What should I cook?</h1><p>Pick a filter and get ideas that fit your time, wallet and kitchen.</p></div><button class="primary-btn" onclick="surprise()">✦ Surprise me</button></div>
<div class="card">${F.map(([k, t]) => `<button class="chip f ${fl[k] ? "on" : ""}" onclick="fl.${k}^=1;hl=-1;V.ideas()">${t}</button>`).join("")}<span class="mut"> ${L.length} idea${L.length == 1 ? "" : "s"}</span></div>
<div class="recipe-grid">${L.map((o) => `<div class="recipe-card" id="i${o.x}" style="${o.x == hl ? "outline:3px solid var(--primary)" : ""}"><div class="recipe-img" style="height:110px;font-size:52px">${em(o.r)}</div><div class="recipe-body"><h3>${o.r.n}</h3><span class="tag">${o.r.t}</span><span class="tag">⏱ ${tm(o.r)} min</span><span class="tag">${rs(o.pp)}/person</span><span class="tag ${o.cv >= 0.5 ? "ok" : "bad"}">🏠 ${Math.round(o.cv * 100)}% in pantry</span><p>${o.c.miss ? "To buy: " + rs(o.c.miss) : "You have everything!"}</p><div class="row"><button class="b" onclick="addMiss(calc(R()[${o.x}],${o.r.s}).rows)">🛒 Add missing</button><button class="g" onclick="rq=R()[${o.x}].n;cook=false;go('recipes')">Recipe →</button></div></div></div>`).join("") || '<div class="card mut">No recipes match all filters. Try turning one off or stock your pantry.</div>'}</div>`);
      };
      function surprise() {
        const L = ideaList();
        if (!L.length) return toast("No ideas match these filters");
        hl = L[Math.floor(Math.random() * L.length)].x;
        V.ideas();
        $("i" + hl).scrollIntoView({ behavior: "smooth", block: "center" });
        toast("How about " + R()[hl].n + "? 😋");
      }
      nav();
      V[tab]();
      upd();
    </script>
  </body>
</html>
