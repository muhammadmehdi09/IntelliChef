<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>IntelliChef — Kya Pakana Hai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="style.css">
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <img
            src="./logo.png"
            alt="IntelliChef — Kya pakana hai"
            class="brand-mark"
          />
          <div>
            <strong>IntelliChef</strong>
            <span>Kya Pakana Hai?</span>
          </div>
        </div>
        <nav class="nav" id="nav"></nav>
      </aside>
      <main class="main">
        <header class="topbar">
          <button
            class="menu-btn"
            onclick="$('sidebar').classList.toggle('open')"
          >
            ☰
          </button>
          <div class="breadcrumb">
            <span>IntelliChef</span><b>/</b
            ><strong id="pageTitle">Dashboard</strong>
          </div>
          <div class="top-actions">
            <button class="secondary-btn compact" onclick="cartT()">
              🛒 Cart (<span id="cc">0</span>)</button
            ><button class="icon-btn" title="Toggle theme" onclick="theme()">
              ☼
            </button>
            <div class="avatar">IC</div>
          </div>
        </header>
        <div class="content" id="app"></div>
      </main>
    </div>
    <aside id="cartp"></aside>
    <div id="toast" class="toast"></div>
    <script src="app.js"></script>

  </body>
</html>
